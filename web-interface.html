<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperInstance.ai - AI Agent Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 40px;
        }

        .auth-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .auth-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
        }

        .response-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .response-content {
            background: white;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e1e5e9;
            min-height: 150px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #333;
        }

        .status {
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 20px;
        }

        .status.ready {
            background: #d4edda;
            color: #155724;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .credentials {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .credentials h3 {
            color: #1976d2;
            margin-bottom: 15px;
        }

        .credentials p {
            margin-bottom: 8px;
            color: #333;
        }

        .credentials strong {
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 SuperInstance.ai</h1>
            <p>AI-Powered Game Development Platform</p>
        </div>

        <div class="content">
            <div class="status ready" id="status">
                ✅ AI Agent Ready
            </div>

            <div class="credentials">
                <h3>🔐 Authentication Credentials</h3>
                <p><strong>Admin:</strong> admin / admin123</p>
                <p><strong>Developer:</strong> developer / dev456</p>
                <p><strong>Demo:</strong> demo / demo789</p>
            </div>

            <div class="auth-section">
                <h2>🎮 Vibe-Coding AI Agent</h2>
                <form id="agentForm">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" value="admin" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" value="admin123" required>
                    </div>

                    <div class="form-group">
                        <label for="prompt">AI Command:</label>
                        <textarea id="prompt" name="prompt" placeholder="Add a red player to the game..." required>Add a red player to the game</textarea>
                    </div>

                    <div class="form-group">
                        <label for="deviceId">Device ID:</label>
                        <input type="text" id="deviceId" name="deviceId" value="web-browser-test" required>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">
                        🚀 Execute AI Command
                    </button>
                </form>
            </div>

            <div class="response-section">
                <h2>📡 AI Response</h2>
                <div class="response-content" id="response">
                    Waiting for AI command...
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('agentForm');
        const responseDiv = document.getElementById('response');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const prompt = document.getElementById('prompt').value;
            const deviceId = document.getElementById('deviceId').value;

            // Update status
            statusDiv.className = 'status loading';
            statusDiv.textContent = '⚡ Executing AI Command...';
            submitBtn.disabled = true;
            submitBtn.textContent = '🤖 Processing...';

            try {
                // Base64 encode credentials
                const credentials = btoa(`${username}:${password}`);

                // Call AI agent
                const response = await fetch('https://api.superinstance.ai/agent/vibe-coding-architect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Basic ${credentials}`
                    },
                    body: JSON.stringify({
                        userPrompt: prompt,
                        gameContext: {},
                        deviceId: deviceId
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    responseDiv.textContent = JSON.stringify(data, null, 2);
                    statusDiv.className = 'status ready';
                    statusDiv.textContent = '✅ AI Command Executed Successfully';
                } else {
                    responseDiv.textContent = JSON.stringify(data, null, 2);
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '❌ AI Command Failed';
                }
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Connection Error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Execute AI Command';
            }
        });

        // Auto-update credentials when username changes
        document.getElementById('username').addEventListener('change', (e) => {
            const username = e.target.value;
            let password = 'admin123';

            if (username === 'developer') {
                password = 'dev456';
            } else if (username === 'demo') {
                password = 'demo789';
            }

            document.getElementById('password').value = password;
        });
    </script>
</body>
</html>
